<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded-square background matching app bg -->
  <rect width="32" height="32" rx="6" fill="#111827"/>

  <!-- Shaft of the incoming-request arrow -->
  <line x1="16" y1="5" x2="16" y2="17"
        stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arrowhead -->
  <polyline points="10,13 16,21 22,13"
            stroke="#4ade80" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Catch tray — the "catcher" -->
  <line x1="6"  y1="27" x2="26" y2="27"
        stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="6"  y1="22" x2="6"  y2="27"
        stroke="#4ade80" stroke-width="2"   stroke-linecap="round"/>
  <line x1="26" y1="22" x2="26" y2="27"
        stroke="#4ade80" stroke-width="2"   stroke-linecap="round"/>
</svg>
